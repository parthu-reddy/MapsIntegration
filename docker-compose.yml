version: '3.8'

services:
  db:
    # PostGIS image which natively supports Apple Silicon ARM64
    image: kartoza/postgis:16-3.4
    container_name: maps_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASS: postgres
      POSTGRES_DBNAME: food_delivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: maps_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
