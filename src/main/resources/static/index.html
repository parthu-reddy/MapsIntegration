<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ola Maps Fleet Command</title>
    
    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    
    <!-- Ola Maps Web SDK v2 -->
    <script src="https://www.unpkg.com/olamaps-web-sdk@latest/dist/olamaps-web-sdk.umd.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Application Styles -->
    <link href="/css/style.css" rel="stylesheet" />
</head>
<body>

    <!-- Sidebar Overlay -->
    <aside id="sidebar">
        <header class="header">
            <h1>Ola Maps Fleet Command</h1>
            <p>Real-time dispatch, spatial routing, and fleet orchestration engine.</p>
        </header>

        <section class="controls">
            <button id="btn-spawn">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                1. Spawn Virtual Fleet
            </button>
            
            <div class="header" style="margin-top: 8px;">
                <p style="color: #cbd5e1; font-weight: 500;">
                    2. Click anywhere on the map to dispatch an order to the nearest driver.
                </p>
            </div>
        </section>

        <section id="status-log" aria-live="polite">
            <!-- Logs dynamically injected here via JS -->
        </section>

        <button id="btn-reset" class="outline" style="margin-top: 8px;">
            Reset Map
        </button>
    </aside>

    <!-- Map Container -->
    <main id="map"></main>

    <!-- Application Logic -->
    <script src="/js/app.js"></script>
</body>
</html>
